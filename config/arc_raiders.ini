[esp]
# What arc_tool esp-export reads. The keys the offline dump modes fill in automatically are left at 0
# here: they belong to a snapshot, not to this file. Values this build has actually measured:
#   chain from the global 0x108FEEC0 is +0xA0 -> +0x250 -> +0x160 (both dumps agree, and all four
#   objects have a valid UObject header), but none of those objects is UWorld - no level round trip
#   in 0x28..0x160 - so no level/array offset below is proven for this build.
# Public sources (a0yark/ArcRaidersRadar, December 2025) claim persistent_level=0xE8,
# level_actors=0x98, root_component=0x130, relative_location=0x11C; NOT verified on pe_timestamp
# 0x6aeb721b, and the xmodius dumper disagrees with 0x38/0xA0/0x128. Do not paste them and trust it:
# run esp-actors (or esp-chain) on a dump and let the structural vote decide.
